[package]
name = "backuprestore-core"
version = "1.6.1"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4.44", features = ["serde", "clock"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2.0.18"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
