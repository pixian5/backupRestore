[package]
name = "backuprestore-cli"
version = "2.2.1"
edition = "2024"

[dependencies]
backuprestore-core = { path = "../backuprestore-core" }
chrono = { version = "0.4.44", features = ["serde", "clock"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.24.0", features = ["v4"] }
